function action(id,label,disabled=false){return `<button data-preview-id="${id}" ${disabled?'disabled aria-disabled="true"':''}>${label}</button>`}function mode(normal,fallback,error){return $('dataMode').value==='normal'?normal:$('dataMode').value==='fallback'?fallback:error}

function render(n=current){current=n;$('state').value=n;let h='';if(n==='N0'||n==='N1')h=`<p class="eyebrow">静水启程</p><h1 data-preview-id="c1-title">${n==='N0'?'记住三条就够了':'三印短课 · 逐条确认'}</h1><div class="seal-row"><button data-preview-id="c1-ordinary" class="seal ordinary"><b class="symbol">○</b><br>普通泡泡 · 拍</button><button data-preview-id="c1-gold" class="seal gold"><b class="symbol">◇</b><br>金色泡泡 · 抓</button><button data-preview-id="c1-gray" class="seal gray"><b class="symbol">▦</b><br>灰色泡泡 · 别碰</button></div><p class="status" data-preview-id="c1-best">最高分：${mode('1260','暂无数据','读取失败')}</p><p data-preview-id="c1-cue">看形状，也看动作字</p><div class="actions">${action('c1-primary',n==='N0'?'开始三分钟':'下一条')}</div>`;

function go(t){if(!sources[t]?.includes(current)){status(`无效来源：${current} 不能执行 ${t}`);return}const blocked=(t==='T02'&&!guards.triad)||(t==='T03'&&!posture)||(t==='T06'&&(!guards.freezeValid||!guards.priorCaptured))||(t==='T08'&&!guards.clock30)||(t==='T09'&&!guards.clock180)||(t==='T10'&&!guards.inputLost)||(t==='T11'&&!guards.poseDrift)||(t==='T15'&&!guards.settled);if(blocked){status(`${t} 条件尚未满足；实验台会显示所需事实`);return}if(['T05','T10','T11'].includes(t)){priorPlay=current;guards.priorCaptured=true}pending=t;if(risky.has(t)){const copy={T03:'保存校准并进入确认？',T04:'确认切换到全空间花窗场？进入后仍可暂停并安全退出。',T06:'确认冻结完整并继续？',T07:'关闭花窗场并重新校准？',T18:'重试写入最高分？'};$('dialogCopy').textContent=copy[t];$('dialog').hidden=false;$('cancel').focus()}else commit()}
function commit(){const t=pending||$('transition').value;pending=null;$('dialog').hidden=true;const target=t==='T06'?priorPlay:targets[t];if(t==='T01')guards.triad=true;if(t==='T03')guards.calibrated=true;if(t==='T06')guards.priorCaptured=false;if(t==='T08')guards.clock30=false;if(t==='T09')guards.clock180=false;if(t==='T15')guards.settled=false;render(target);status(`${t} → ${target} 已执行`)}function status(s){let x=document.querySelector('#runtimeStatus');if(!x){x=document.createElement('p');x.id='runtimeStatus';x.className='status';$('window').prepend(x)}x.textContent=s}
$('runTransition').onclick=()=>{const t=$('transition').value;if(t==='T08')guards.clock30=true;if(t==='T09')guards.clock180=true;if(t==='T10')guards.inputLost=true;if(t==='T11')guards.poseDrift=true;if(t==='T15')guards.settled=true;go(t)};$('state').onchange=e=>render(e.target.value);$('cancel').onclick=()=>{pending=null;$('dialog').hidden=true};$('confirm').onclick=commit;$('systemBack').onclick=back;addEventListener('keydown',e=>{if(e.key==='Escape')back()});function back(){if(!$('dialog').hidden){$('cancel').click();return}if(current==='N6'){status('保持暂停；请选择继续、重校准或结束本局');return}const map={N1:'N0',N2:'N1',N3:'N2',N4:'N6',N5:'N6',N7:'N6',N8:'N9',N9:'N0'};render(map[current]||'N0')}
$('tier').onchange=e=>$('window').className=`window ${e.target.value}`;$('rm').onclick=()=>{const on=!document.body.classList.toggle('reduced');$('rm').setAttribute('aria-pressed',String(!on));$('rm').textContent=`减弱动效：${on?'关':'开'}`};$('dataMode').onchange=()=>render();
function loadLab(){const key=$('component').value,c=comps[key];$('variant').innerHTML=c.v.map(x=>`<option>${x}</option>`).join('');$('componentState').innerHTML=c.s.map(x=>`<option>${x}</option>`).join('');$('stack').innerHTML=`<option value="none">单状态</option><option value="rule">${stacks[key]}</option>`}
function componentMarkup(c,v,s){const names={C1:'三规则印章',C2:'互动区校准',C3:'全空间确认',C4:'安全花窗',C5:'泡泡演员',C6:'局内脉冲',C7:'冻结恢复',C8:'结算花朵'};const semantic=c==='C5'?(v==='gold'?'◇ 金色 · 抓':v==='gray'?'▦ 灰色 · 别碰':'○ 普通 · 拍'):`${names[c]} · ${v}`;const winner=$('stack').value==='rule'?stacks[c]:(s==='error'?'错误':s);const stateCopy={sampling:'轮廓正在逐点形成',stale:'保留旧轮廓，禁止确认',ready:'安全区已就绪',eligible:'进入互动带，可判定','hold-progress':'抓取环 70%','terminal-success':'唯一终局：成功','terminal-error':'唯一终局：动作不符',pooled:'对象已回池，碰撞关闭','out-of-bounds':'越界回池，不瞬移',boundary:'30 秒边界原子提交','input-none':'输入未就绪，冻结','input-wait':'等待输入恢复','boundary-disabled':'边界失效，先重校准','exit-confirm':'取消优先、焦点锁定',partial:'统计不完整，不授徽章','save-loading':'正在保存最高分','save-error':'保存失败，可重试'}[s]||`状态：${s}`;let anatomy='';if(c==='C1')anatomy='<div class="seal-row"><span>○ 拍</span><span>◇ 抓</span><span>▦ 别碰</span></div>';if(c==='C2')anatomy='<div class="aperture"><div class="fan"></div><div class="band">互动区</div></div>';if(c==='C3')anatomy='<div class="panel" role="dialog"><b>进入花窗场？</b><p>取消为默认</p></div>';if(c==='C4')anatomy='<div class="aperture"><div class="fan">前方安全花窗</div><div class="band">固定互动带</div></div>';if(c==='C5')anatomy=`<div class="bubble ${v==='gold'?'b2':v==='gray'?'b3':'b1'}" style="position:relative;left:auto;top:auto"><span>${semantic}</span></div>`;if(c==='C6')anatomy='<div class="hud"><b>02:30</b><span>第 2 段</span><button>暂停</button></div>';if(c==='C7')anatomy='<div class="panel"><b>✓ 时间　✓ 泡泡　✓ 判定</b><div class="actions"><button>继续</button><button>重校准</button></div></div>';if(c==='C8')anatomy='<div class="stats"><b>92%</b><b>银徽章 ◇</b><b>1260</b></div>';const rows=elements[c].map(id=>{const isAction=/(primary|retry|confirm|cancel|enter|pause|resume|switch|calibrate|exit|discard|replay|home|save-retry)$/.test(id);return isAction?action(id,`${id} · ${stateCopy}`,s.includes('disabled')||s==='error'||s==='pooled'):`<div data-preview-id="${id}" data-binding-target="true">${id} · ${stateCopy}</div>`}).join('');return `<h3>${semantic}</h3><p class="semantic"><i class="dot"></i>胜出状态：${winner}</p>${anatomy}<p>${stateCopy}</p><div class="element-grid">${rows}</div>`}
function applyLab(){const c=$('component').value,v=$('variant').value,s=$('componentState').value,d=$('componentDemo');d.dataset.component=c;d.dataset.variant=v;d.dataset.state=s;d.dataset.precedence=$('stack').value==='rule'?stacks[c]:'none';d.className=`card component-demo ${$('stack').value==='rule'?'stack':''}`;d.innerHTML=componentMarkup(c,v,s);refreshBinding()}
bindingSpecs.forEach((b,i)=>$('binding').add(new Option(`${b[0]} · ${b[1]}`,String(i))));function refreshBinding(){const b=bindingSpecs[+$('binding').value||0];if($('component').value!==b[0]){$('component').value=b[0];loadLab()}const target=document.querySelector(`#componentDemo [data-preview-id="${b[2]}"]`),m=$('dataMode').value,p=b[1];if(target){target.dataset.binding=p;target.dataset.mode=m;target.style.outline='3px solid #efb83f';let copy=m==='normal'?`${b[2]} · 正常事实已呈现`:m==='fallback'?`${b[2]} · 回退：保留最后可信事实`:`${b[2]} · 错误：阻断并显示恢复`;if(/envelope|bandPose|forwardAxis|arrivalSeed/.test(p)&&m!=='normal'){copy+=` · 不生成/不显示`;target.style.visibility=m==='error'?'hidden':'visible'}if(/canAccept|canOpen|canPause|canResume|availableSources|primaryAction/.test(p)&&m!=='normal'){copy+=` · 动作禁用`;if(target.tagName==='BUTTON'){target.disabled=true;target.setAttribute('aria-disabled','true')}}if(/kind/.test(p)){copy=m==='normal'?'○ 普通 · 拍':m==='fallback'?'? 未知类别 · 回池':'! 类别冲突 · 回池'}if(/freezeSeal/.test(p)&&m!=='normal'){copy+=` · 冻结保持且禁止继续`;target.closest('.component-demo').dataset.state='frozen'}if(/runTally/.test(p)&&m!=='normal'){copy+=` · 统计不完整，不授徽章/不保存`;target.closest('.component-demo').dataset.state='partial'}if(/writeState/.test(p)){copy=m==='normal'?'✓ 已保存':m==='fallback'?'… 正在保存':'! 未保存 · 可重试'}target.textContent=copy}const conversion=/kind|badge|state|armed|completeness|validity|result/.test(p)?'颜色+形状+中文标签':'文字/数值';$('bindingEvidence').textContent=`${p} → ${b[2]}；模式=${m}；转换=${conversion}；拥有组件=${b[0]}。`}
$('component').onchange=()=>{loadLab();applyLab()};$('variant').onchange=applyLab;$('componentState').onchange=applyLab;$('stack').onchange=applyLab;$('binding').onchange=()=>{const b=bindingSpecs[+$('binding').value];$('component').value=b[0];loadLab();applyLab()};$('apply').onclick=applyLab;$('dataMode').addEventListener('change',()=>{render();applyLab()});loadLab();applyLab();render();
</script></body></html>
