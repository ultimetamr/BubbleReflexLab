function renderScene(s){current=s;$('#stateSelect').value=s;$('#stateLabel').textContent=s;$('#sceneTitle').textContent=states[s];win.dataset.state=s;let h='';if(s==='S0')h=componentFragment('C1','ready',s)+componentFragment('C2','start',s);else if(s==='S1')h=`<div class="space-scene">${componentFragment('C3','standing',s)}</div>`;else if(s==='S2'||s==='S3')h=`<div class="space-scene">${componentFragment('C3','standing',s)}${componentFragment('C5',s==='S2'?'tutorial':'run',s)}${componentFragment('C4',s==='S2'?'tutorial':'normal',s)}</div>`;else if(s==='S4'||s==='S7')h=`<div class="space-scene">${componentFragment('C6',s==='S7'?'inputUnavailable':'manualPause',s)}</div>`;else if(s==='S5')h=`<div class="space-scene">${componentFragment('C6','exitConfirm',s)}</div>`;else h=componentFragment('C7','complete',s)+componentFragment('C2','result',s);scene.innerHTML=h;bindSceneActions();applyDataClass();if(s==='S5')setTimeout(()=>ask('TR12','S0'),0);}
